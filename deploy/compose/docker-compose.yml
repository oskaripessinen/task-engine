services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN: ${DB_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      API_PORT: ${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN: ${DB_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      WORKER_COUNT: ${WORKER_COUNT}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT}
    ports:
      - "${WORKER_METRICS_PORT}:${WORKER_METRICS_PORT}"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h postgres < /migrations/001_create_jobs.sql
